server:
  port: 8000
  # 生产环境优雅停机：等待正在处理的请求完成
  shutdown: graceful
  tomcat:
    # Tomcat 运行时目录（work 等）跟随启动目录
    basedir: ${user.dir}
    accesslog:
      enabled: true
      directory: logs
      prefix: access
      suffix: .log
      pattern: '%h %t "%r" %s %b %D'
      rotate: true

spring:
  application:
    name: embedding-server
  lifecycle:
    timeout-per-shutdown-phase: 30s

embedding:
  model-name: Qwen3-Embedding-0.6B
  # 相对路径按启动工作目录解析，建议在项目根目录启动
  model-path: models/model_int8.onnx
  tokenizer-path: models/tokenizer.json
  # 单条文本最大 token 数（含模板追加的 EOS），超出截断
  max-tokens: 1024
  # 单次请求最多文本条数
  max-inputs: 64
  # 同时执行的推理数，建议按逻辑核数的 1/3~1/2 设置
  max-concurrency: 4
  # ONNX 算子内线程数，0 表示由 ONNX Runtime 自动决定
  intra-op-threads: 0
  # 模型输出维度，模型输出无法识别时使用
  dimension: 1024
  # 启动后先用一条短文本预热，避免首个请求过慢
  warmup: true
  # 单次请求体上限（字节），超出直接返回 413
  max-request-bytes: 4194304
  # 并发数已满时的排队等待秒数，超时返回 503
  queue-timeout-seconds: 30
  # 可选 API Key；非空时校验 Authorization: Bearer <key>
  api-key: ""
  # GPU 设备号；-1 表示 CPU。启用 GPU 需取消注释 GPU 依赖，并安装 CUDA 12 + cuDNN 8
  gpu-id: -1

logging:
  level:
    com.police.embedding: info
